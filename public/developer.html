<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Developer Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f7fb;
}

.navbar{

height:80px;

background:#081c4d;

display:flex;

justify-content:space-between;

align-items:center;

padding:0 40px;

color:white;
}

.logout-btn{

background:#ef4444;

border:none;

color:white;

padding:12px 20px;

border-radius:10px;

cursor:pointer;
}

.hero{

background:
linear-gradient(
135deg,
#081c4d,
#0052cc,
#00a8ff
);

color:white;

padding:60px;
}

.hero h1{

font-size:50px;
}

.hero p{

margin-top:10px;
}

.cards{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:20px;

margin:30px;

margin-top:-40px;
}

.card{

background:white;

padding:25px;

border-radius:20px;

text-align:center;

box-shadow:
0 10px 30px rgba(0,0,0,.08);
}

.card h3{

color:#64748b;
}

.card h1{

margin-top:10px;

color:#0052cc;
}

.table-section{

background:white;

margin:30px;

padding:25px;

border-radius:20px;

box-shadow:
0 10px 30px rgba(0,0,0,.08);

overflow-x:auto;
}

table{

width:100%;

border-collapse:collapse;
}

th,td{

padding:15px;

text-align:left;
}

th{

background:#f8fafc;
}

tr{

border-bottom:1px solid #eee;
}

.status-select{

padding:10px;

border-radius:8px;
}

.update-btn{

background:#16a34a;

color:white;

border:none;

padding:10px 15px;

border-radius:8px;

cursor:pointer;
}

</style>

</head>

<body>

<div class="navbar">

<h2>
👨‍💻 Developer Dashboard
</h2>

<button
class="logout-btn"
onclick="logout()">

Logout

</button>

</div>

<div class="hero">

<h1>
Assigned Bugs
</h1>

<p>
Track, Fix and Resolve Bugs
</p>

</div>

<div class="cards">

<div class="card">
<h3>Total Assigned</h3>
<h1 id="totalCount">0</h1>
</div>

<div class="card">
<h3>Open</h3>
<h1 id="openCount">0</h1>
</div>

<div class="card">
<h3>In Progress</h3>
<h1 id="progressCount">0</h1>
</div>

<div class="card">
<h3>Resolved</h3>
<h1 id="resolvedCount">0</h1>
</div>

</div>

<div class="table-section">

<h2>
My Assigned Bugs
</h2>

<br>

<table>

<thead>

<tr>

<th>Title</th>
<th>Module</th>
<th>Severity</th>
<th>Reported By</th>
<th>Status</th>
<th>Update</th>

</tr>

</thead>

<tbody id="bugTable">

</tbody>

</table>

</div>

<script>

loadBugs();

async function loadBugs(){

const response =
await fetch("/assignedbugs/developer");

const bugs =
await response.json();

let rows="";

let open=0;
let progress=0;
let resolved=0;

bugs.forEach(bug=>{

if(bug.status==="Open")
open++;

if(bug.status==="In Progress")
progress++;

if(bug.status==="Resolved")
resolved++;

rows += `

<tr>

<td>${bug.title}</td>

<td>${bug.module}</td>

<td>${bug.severity}</td>

<td>${bug.reportedBy}</td>

<td>

<select
class="status-select"
id="status-${bug._id}">

<option
${bug.status==="Open"?"selected":""}>
Open
</option>

<option
${bug.status==="In Progress"?"selected":""}>
In Progress
</option>

<option
${bug.status==="Resolved"?"selected":""}>
Resolved
</option>

</select>

</td>

<td>

<button
class="update-btn"
onclick="updateStatus(
'${bug._id}'
)">

Update

</button>

</td>

</tr>

`;

});

document.getElementById(
"bugTable"
).innerHTML = rows;

document.getElementById(
"totalCount"
).innerText = bugs.length;

document.getElementById(
"openCount"
).innerText = open;

document.getElementById(
"progressCount"
).innerText = progress;

document.getElementById(
"resolvedCount"
).innerText = resolved;

}

async function updateStatus(id){

const status =
document.getElementById(
`status-${id}`
).value;

await fetch(
`/bugs/${id}/status`,
{
method:"PUT",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
status:status
})
});

alert(
"Status Updated"
);

loadBugs();

}

function logout(){

localStorage.clear();

window.location =
"login.html";

}

</script>

</body>
</html>
